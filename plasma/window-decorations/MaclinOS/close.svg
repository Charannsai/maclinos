<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="12" viewBox="0 0 48 12">
  <defs>
    <linearGradient id="closeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6059"/>
      <stop offset="100%" stop-color="#E0443E"/>
    </linearGradient>
    <linearGradient id="closeGradHover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF544D"/>
      <stop offset="100%" stop-color="#D3332D"/>
    </linearGradient>
  </defs>

  <!-- Active / Normal State (at 0,0) -->
  <g id="active-center">
    <circle cx="6" cy="6" r="5.5" fill="url(#closeGrad)" stroke="#C6342E" stroke-width="0.5"/>
  </g>

  <!-- Hover State (at 12,0) -->
  <g id="hover-center">
    <circle cx="18" cy="6" r="5.5" fill="url(#closeGradHover)" stroke="#B82B25" stroke-width="0.5"/>
    <line x1="15.5" y1="3.5" x2="20.5" y2="8.5" stroke="#4C0000" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="20.5" y1="3.5" x2="15.5" y2="8.5" stroke="#4C0000" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- Pressed State (at 24,0) -->
  <g id="pressed-center">
    <circle cx="30" cy="6" r="5.5" fill="#BF2E28" stroke="#9E221D" stroke-width="0.5"/>
    <line x1="27.5" y1="3.5" x2="32.5" y2="8.5" stroke="#2D0000" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="32.5" y1="3.5" x2="27.5" y2="8.5" stroke="#2D0000" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Inactive / Deactivated State (at 36,0) -->
  <g id="deactivated-center">
    <circle cx="42" cy="6" r="5.5" fill="#D2D2D7" stroke="#BCBCC0" stroke-width="0.5"/>
  </g>
</svg>
