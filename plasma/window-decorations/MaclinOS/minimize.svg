<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="12" viewBox="0 0 48 12">
  <defs>
    <linearGradient id="minGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFBD2E"/>
      <stop offset="100%" stop-color="#DEA123"/>
    </linearGradient>
    <linearGradient id="minGradHover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB31A"/>
      <stop offset="100%" stop-color="#CF9117"/>
    </linearGradient>
  </defs>

  <!-- Active / Normal State -->
  <g id="active-center">
    <circle cx="6" cy="6" r="5.5" fill="url(#minGrad)" stroke="#BF8515" stroke-width="0.5"/>
  </g>

  <!-- Hover State -->
  <g id="hover-center">
    <circle cx="18" cy="6" r="5.5" fill="url(#minGradHover)" stroke="#AA740E" stroke-width="0.5"/>
    <line x1="15.5" y1="6" x2="20.5" y2="6" stroke="#5C3B00" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- Pressed State -->
  <g id="pressed-center">
    <circle cx="30" cy="6" r="5.5" fill="#C28612" stroke="#94640A" stroke-width="0.5"/>
    <line x1="27.5" y1="6" x2="32.5" y2="6" stroke="#3D2600" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Inactive / Deactivated State -->
  <g id="deactivated-center">
    <circle cx="42" cy="6" r="5.5" fill="#D2D2D7" stroke="#BCBCC0" stroke-width="0.5"/>
  </g>
</svg>
