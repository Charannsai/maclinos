<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- MaclinOS Window Decoration: Minimize Button -->
  <!-- Traffic light style - Amber/Yellow -->
  <defs>
    <linearGradient id="minGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD036"/>
      <stop offset="100%" stop-color="#FEBC2E"/>
    </linearGradient>
    <linearGradient id="minGradHover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5B800"/>
      <stop offset="100%" stop-color="#E5A100"/>
    </linearGradient>
  </defs>

  <!-- Normal -->
  <circle cx="6" cy="6" r="5.5" fill="url(#minGrad)" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>

  <!-- Hover (with minus icon) -->
  <circle cx="18" cy="6" r="5.5" fill="url(#minGradHover)" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>
  <line x1="15.5" y1="6" x2="20.5" y2="6" stroke="rgba(0,0,0,0.5)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Press -->
  <circle cx="30" cy="6" r="5.5" fill="#CC8F00" stroke="rgba(0,0,0,0.2)" stroke-width="0.5"/>
  <line x1="27.5" y1="6" x2="32.5" y2="6" stroke="rgba(0,0,0,0.6)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Inactive -->
  <circle cx="42" cy="6" r="5.5" fill="#D4D4D8" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
</svg>
