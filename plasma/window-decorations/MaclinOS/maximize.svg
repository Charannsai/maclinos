<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="12" viewBox="0 0 48 12">
  <defs>
    <linearGradient id="maxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28C840"/>
      <stop offset="100%" stop-color="#1FAF34"/>
    </linearGradient>
    <linearGradient id="maxGradHover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24B739"/>
      <stop offset="100%" stop-color="#1B9A2D"/>
    </linearGradient>
  </defs>

  <!-- Active / Normal State -->
  <g id="active-center">
    <circle cx="6" cy="6" r="5.5" fill="url(#maxGrad)" stroke="#178825" stroke-width="0.5"/>
  </g>

  <!-- Hover State (two opposing diagonal arrows) -->
  <g id="hover-center">
    <circle cx="18" cy="6" r="5.5" fill="url(#maxGradHover)" stroke="#13741E" stroke-width="0.5"/>
    <path d="M15.5,5 L15.5,3.5 L17,3.5 M20.5,7 L20.5,8.5 L19,8.5 M15.5,3.5 L20.5,8.5" fill="none" stroke="#004008" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pressed State -->
  <g id="pressed-center">
    <circle cx="30" cy="6" r="5.5" fill="#188A29" stroke="#0F5E16" stroke-width="0.5"/>
    <path d="M27.5,5 L27.5,3.5 L29,3.5 M32.5,7 L32.5,8.5 L31,8.5 M27.5,3.5 L32.5,8.5" fill="none" stroke="#002905" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Inactive / Deactivated State -->
  <g id="deactivated-center">
    <circle cx="42" cy="6" r="5.5" fill="#D2D2D7" stroke="#BCBCC0" stroke-width="0.5"/>
  </g>
</svg>
