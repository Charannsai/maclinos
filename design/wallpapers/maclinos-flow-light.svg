<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FF" />
      <stop offset="40%" stop-color="#DCE7F7" />
      <stop offset="70%" stop-color="#E8EAF6" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFECD2" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FCB69F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#5E5CE6" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#BF5AF2" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="wave2" x1="10%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#30D158" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#00C7BE" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#0A84FF" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="wave3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF375F" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#FF9F0A" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFD60A" stop-opacity="0.4" />
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" />
    </filter>

    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="140" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="3840" height="2160" fill="url(#bgLight)" />
  <rect width="3840" height="2160" fill="url(#sunGlow)" />

  <!-- Ambient Color Blooms -->
  <g filter="url(#ambientBlur)">
    <circle cx="900" cy="1600" r="700" fill="#0A84FF" opacity="0.35" />
    <circle cx="2800" cy="700" r="850" fill="#BF5AF2" opacity="0.3" />
    <circle cx="1900" cy="1100" r="600" fill="#30D158" opacity="0.25" />
    <circle cx="3100" cy="1700" r="650" fill="#FF375F" opacity="0.2" />
  </g>

  <!-- Flowing Organic Ribbon Curves -->
  <g filter="url(#softBlur)" opacity="0.85">
    <!-- Primary Sweeping Wave -->
    <path d="M-200,1400 C600,1900 1400,1000 2200,1500 C2800,1900 3400,1300 4100,1100 L4100,2300 L-200,2300 Z" fill="url(#wave1)" />

    <!-- Secondary Harmonic Ribbon -->
    <path d="M-200,800 C800,600 1300,1500 2100,1200 C2900,900 3500,1600 4100,1300 L4100,2300 L-200,2300 Z" fill="url(#wave2)" mix-blend-mode="screen" opacity="0.7" />

    <!-- Accent Warm Wave -->
    <path d="M-100,1800 C700,1200 1600,1700 2400,1100 C3000,700 3600,1000 4100,800 L4100,2300 L-100,2300 Z" fill="url(#wave3)" mix-blend-mode="overlay" opacity="0.5" />
  </g>

  <!-- Precision High-Definition Top Shimmer Curve -->
  <path d="M-100,1250 C900,1550 1600,1050 2400,1350 C3100,1600 3650,1150 4050,1050" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4" />
  <path d="M-100,1200 C850,1520 1550,1010 2350,1320 C3050,1570 3600,1120 4050,1020" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.25" />
</svg>
